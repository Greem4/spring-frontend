server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' $VITE_API_URL; frame-src 'none';";
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";

    # Compression
    gzip on;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
    brotli_comp_level 6;

    # Cache control
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-XSS-Protection "1; mode=block";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location = /50x.html {
        internal;
        expires -1;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}